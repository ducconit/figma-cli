name: Release Multi-OS Binaries

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Upload Artifacts (Linux, macOS, Windows)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Run Go Vet & Unit Tests
        run: |
          go vet ./...
          go test -v -race -count=1 ./...

      - name: Resolve Version Metadata
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW_VER="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER="0.1.0"
          fi
          VERSION="${RAW_VER#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "tag=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Cross-Compile Binaries (Linux, macOS, Windows)
        run: |
          mkdir -p dist/linux dist/macos dist/windows dist/release

          LDFLAGS="-s -w -buildid= \
            -X github.com/ducconit/figma-cli/internal/version.Version=${{ steps.meta.outputs.version }} \
            -X github.com/ducconit/figma-cli/internal/version.Commit=${{ steps.meta.outputs.commit }} \
            -X github.com/ducconit/figma-cli/internal/version.BuildDate=${{ steps.meta.outputs.build_date }}"
          GCFLAGS="all=-l -B -C"

          # 1. Linux (amd64 & arm64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -gcflags="${GCFLAGS}" -ldflags="${LDFLAGS}" -o dist/linux/fm-linux-amd64 ./cmd/fm
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -gcflags="${GCFLAGS}" -ldflags="${LDFLAGS}" -o dist/linux/fm-linux-arm64 ./cmd/fm
          chmod +x dist/linux/fm-linux-*
          cp dist/linux/fm-linux-* dist/release/
          tar -czf dist/release/fm-linux-amd64.tar.gz -C dist/linux fm-linux-amd64
          tar -czf dist/release/fm-linux-arm64.tar.gz -C dist/linux fm-linux-arm64

          # 2. macOS / Darwin (amd64 & arm64 Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -buildvcs=false -gcflags="${GCFLAGS}" -ldflags="${LDFLAGS}" -o dist/macos/fm-macos-amd64 ./cmd/fm
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false -gcflags="${GCFLAGS}" -ldflags="${LDFLAGS}" -o dist/macos/fm-macos-arm64 ./cmd/fm
          chmod +x dist/macos/fm-macos-*
          cp dist/macos/fm-macos-* dist/release/
          tar -czf dist/release/fm-macos-amd64.tar.gz -C dist/macos fm-macos-amd64
          tar -czf dist/release/fm-macos-arm64.tar.gz -C dist/macos fm-macos-arm64

          # 3. Windows (amd64 & arm64)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -gcflags="${GCFLAGS}" -ldflags="${LDFLAGS}" -o dist/windows/fm-windows-amd64.exe ./cmd/fm
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -buildvcs=false -gcflags="${GCFLAGS}" -ldflags="${LDFLAGS}" -o dist/windows/fm-windows-arm64.exe ./cmd/fm
          cp dist/windows/fm-windows-*.exe dist/release/
          (cd dist/windows && zip -q ../release/fm-windows-amd64.zip fm-windows-amd64.exe)
          (cd dist/windows && zip -q ../release/fm-windows-arm64.zip fm-windows-arm64.exe)

          # Generate SHA-256 Checksums
          (cd dist/release && sha256sum * > checksums.txt)
          ls -lh dist/release/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fm-linux-${{ steps.meta.outputs.version }}
          path: |
            dist/linux/*
            dist/release/fm-linux-*.tar.gz
          if-no-files-found: error

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fm-macos-${{ steps.meta.outputs.version }}
          path: |
            dist/macos/*
            dist/release/fm-macos-*.tar.gz
          if-no-files-found: error

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fm-windows-${{ steps.meta.outputs.version }}
          path: |
            dist/windows/*
            dist/release/fm-windows-*.zip
          if-no-files-found: error

      - name: Upload All Release Assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/release/fm-linux-amd64
            dist/release/fm-linux-arm64
            dist/release/fm-linux-amd64.tar.gz
            dist/release/fm-linux-arm64.tar.gz
            dist/release/fm-macos-amd64
            dist/release/fm-macos-arm64
            dist/release/fm-macos-amd64.tar.gz
            dist/release/fm-macos-arm64.tar.gz
            dist/release/fm-windows-amd64.exe
            dist/release/fm-windows-arm64.exe
            dist/release/fm-windows-amd64.zip
            dist/release/fm-windows-arm64.zip
            dist/release/checksums.txt
